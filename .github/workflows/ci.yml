name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://copilot:copilot@127.0.0.1:5432/copilot
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: copilot
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot -d copilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: docker pull python:3.11-slim
      - run: pytest
      - name: Create a masked local test token
        run: |
          token=$(python -m local_coding_copilot.security_cli --user-id ci-admin --role admin --project-id default)
          echo "::add-mask::$token"
          echo "COPILOT_API_TOKEN=$token" >> "$GITHUB_ENV"
      - run: python -m local_coding_copilot.rag_cli ingest data/synthetic
      - run: python -m local_coding_copilot.smoke
      - run: python -m local_coding_copilot.evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: m3-evaluation-${{ matrix.python-version }}
          path: data/runtime/m3-evaluation.json
