[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-coding-copilot"
version = "0.1.0"
description = "Local-first coding copilot with grounded RAG and sandboxed execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "mcp==2.3.0",
    "psycopg[binary]==3.3.8",
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
    "ruff==0.14.5",
]

[project.scripts]
copilot-coding-evaluation = "local_coding_copilot.coding_evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
